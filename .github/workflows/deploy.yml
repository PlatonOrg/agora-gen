name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_FRONT: ghcr.io/salemsd/agora-gen/frontend
  IMAGE_NAME_BACK: ghcr.io/salemsd/agora-gen/backend

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            back/requirements-base.txt
            back/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-base.txt -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Expose the image digests so the deploy job can pin to the exact builds.
    outputs:
      backend-digest: ${{ steps.build-backend.outputs.digest }}
      frontend-digest: ${{ steps.build-frontend.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./back/Dockerfile
          push: true
          # Tag with both :latest (convenience) and the commit SHA (immutable, enables rollback).
          tags: |
            ${{ env.IMAGE_NAME_BACK }}:latest
            ${{ env.IMAGE_NAME_BACK }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./front/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME_FRONT }}:latest
            ${{ env.IMAGE_NAME_FRONT }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Named environment enables protection rules (required reviewers, wait timer)
    # configured in Settings > Environments > production.
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Transfer docker-compose.prod.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/opt/agora"

      - name: Write .env.prod and deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_PROD_CONTENT: ${{ secrets.ENV_PROD }}
          # GH_PAT is passed via envs — never interpolated directly into the script body.
          GH_PAT: ${{ secrets.GH_PAT }}
          # Pin deployment to the exact digests produced by the build job above.
          BACKEND_DIGEST: ${{ needs.build-and-push.outputs.backend-digest }}
          FRONTEND_DIGEST: ${{ needs.build-and-push.outputs.frontend-digest }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ENV_PROD_CONTENT,GH_PAT,BACKEND_DIGEST,FRONTEND_DIGEST
          script: |
            cd /opt/agora

            # Write the production env file from the GitHub secret.
            # Strip carriage returns to guard against Windows-style line endings
            # in the secret value, which would cause variables to appear blank.
            printf '%s\n' "$ENV_PROD_CONTENT" | sed 's/\r//' > .env.prod
            chmod 600 .env.prod

            # Validate that all required variables are present and non-empty
            # in the written file before attempting to start any container.
            echo "--- Validating .env.prod ---"
            REQUIRED_VARS="POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB REDIS_HOST REDIS_PORT"
            VALIDATION_FAILED=0
            for VAR in $REQUIRED_VARS; do
              VALUE=$(grep -E "^${VAR}=" .env.prod | cut -d'=' -f2- | tr -d '\r')
              if [ -z "$VALUE" ]; then
                echo "ERROR: Required variable '$VAR' is missing or empty in .env.prod"
                VALIDATION_FAILED=1
              else
                echo "OK: $VAR is set"
              fi
            done
            if [ "$VALIDATION_FAILED" -eq 1 ]; then
              echo "Aborting deployment: one or more required variables are not set."
              exit 1
            fi
            echo "--- Validation passed ---"

            # Authenticate to the container registry using the PAT passed via envs.
            # The username is the org account, never a personal actor variable.
            echo "$GH_PAT" | docker login ghcr.io -u salemsd --password-stdin

            # Pull the exact image digests built in this pipeline run, not :latest.
            # This guarantees the deployed image matches exactly what was built in CI.
            docker pull ghcr.io/salemsd/agora-gen/backend@${BACKEND_DIGEST}
            docker pull ghcr.io/salemsd/agora-gen/frontend@${FRONTEND_DIGEST}

            # Re-tag the pinned digests as :latest so compose resolves them by name.
            docker tag ghcr.io/salemsd/agora-gen/backend@${BACKEND_DIGEST} ghcr.io/salemsd/agora-gen/backend:latest
            docker tag ghcr.io/salemsd/agora-gen/frontend@${FRONTEND_DIGEST} ghcr.io/salemsd/agora-gen/frontend:latest

            # Deploy using the freshly tagged images.
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

