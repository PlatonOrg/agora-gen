services:
  frontend:
    image: ghcr.io/agoraplaton/fullstack/frontend:latest
    container_name: agora_frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - agora_net
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  api:
    image: ghcr.io/agoraplaton/fullstack/backend:latest
    container_name: agora_backend
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /opt/models:/opt/models
      - /opt/agora/resources/docs:/app/resources/docs
    networks:
      - agora_net
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

  db:
    image: pgvector/pgvector:pg16
    container_name: agora_db
    env_file:
      - .env.prod
    volumes:
      - agora_pg_data:/var/lib/postgresql/data
    networks:
      - agora_net
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: agora_redis
    command: >
      sh -c "redis-server $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"
    env_file:
      - .env.prod
    volumes:
      - agora_redis_data:/data
    networks:
      - agora_net
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  agora_pg_data:
  agora_redis_data:

networks:
  agora_net:
    name: agora_net
    driver: bridge