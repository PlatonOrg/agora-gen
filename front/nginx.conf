worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ---------------------------------------------------------------------------
    # Rate limiting: 60 requests/minute per IP on API endpoints.
    # burst=20 allows short spikes; nodelay serves the burst without queuing.
    # ---------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        server_tokens off;

        # ---------------------------------------------------------------------------
        # Security headers
        # ---------------------------------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'googleapis.com' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

        # ---------------------------------------------------------------------------
        # Frontend: Angular client-side routing
        # ---------------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # Static assets: aggressive caching (hashed filenames)
        location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            access_log off;
        }

        # Block direct access to the resources directory
        location /resources/ {
            deny all;
            return 403;
        }

        # ---------------------------------------------------------------------------
        # Backend: Reverse proxy for API and SSE streams
        # ---------------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://agora_backend:8000;

            # HTTP/1.1 keep-alive to upstream (required for long-lived SSE)
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Disable all buffering so chunks are forwarded immediately
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_set_header X-Accel-Buffering no;

            # Long timeouts for generation streams (up to 1 hour)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Hide internal server details from API responses
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
        }
    }
}
