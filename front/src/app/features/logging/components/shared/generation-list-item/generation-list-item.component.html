<article class="gen-item">

  <button class="gen-item__header" type="button" (click)="onSelect()">
    <div class="gen-item__type-bar" [class.gen-item__type-bar--disc]="isDiscussion()"></div>

    <div class="gen-item__meta">
      <span class="gen-item__kind-badge" [class.gen-item__kind-badge--disc]="isDiscussion()">
        {{ isDiscussion() ? 'Discussion' : 'Exercice' }}
      </span>
      @if (statusLabel(gen().status)) {
        <span class="gen-item__status-badge"
          [class.gen-item__status-badge--error]="isErrorStatus(gen().status)"
          [class.gen-item__status-badge--stopped]="gen().status === 'stopped'"
          [class.gen-item__status-badge--progress]="gen().status === 'in_progress'">
          {{ statusLabel(gen().status) }}
        </span>
      }
      <span class="gen-item__request">{{ preview() }}</span>
    </div>

    <div class="gen-item__right">
      <span class="gen-item__time">{{ fmt(gen().created_at) }}</span>
    </div>

    <svg class="gen-item__chevron"
      xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
      <path d="M9 18l6-6-6-6"/>
    </svg>
  </button>


</article>
