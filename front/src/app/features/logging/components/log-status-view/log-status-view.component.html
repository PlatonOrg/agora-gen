@if (state() === 'loading') {
  <div class="status-view status-view--loading">
    <div class="status-view__spinner"></div>
    <p class="status-view__text">Chargement…</p>
  </div>
} @else if (state() === 'error') {
  <div class="status-view status-view--error">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <p class="status-view__text">{{ errorMessage() || 'Une erreur est survenue.' }}</p>
  </div>
} @else if (state() === 'success' && empty()) {
  <div class="status-view status-view--empty">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/>
    </svg>
    <p class="status-view__text">{{ emptyMessage() || 'Aucun résultat.' }}</p>
  </div>
}
