<div class="workspace-container">

  @if (onboarding.isActive() && onboarding.currentStep()) {
    <app-tour-tooltip
      [step]="onboarding.currentStep()!"
      [progressLabel]="onboarding.progressLabel()"
      [isLastStep]="onboarding.isLastStep()"
      [totalSteps]="onboarding.steps.length"
      [currentStepIndex]="onboarding.currentStepIndex()"
      (nextStep)="onboarding.next()"
      (skipTour)="onboarding.skip()"
    />
  }

  @if (showUseTemplateConfirm()) {
    <app-confirm-dialog
      [options]="useTemplateDialogOptions"
      (confirmed)="confirmUseTemplate()"
      (cancelled)="cancelUseTemplate()"
    />
  }

  @if (showResetAllConfirm()) {
    <app-confirm-dialog
      [options]="resetAllDialogOptions"
      (confirmed)="confirmResetAll()"
      (cancelled)="cancelResetAll()"
    />
  }

  <div class="left-area" [class.left-area--panel-open]="wsStore.activeLeftTab() !== null">


    <div class="left-panel-content"
      [class.left-panel-content--animate]="wsStore.activeLeftTab() === 'discussion'"
      [class.left-panel-content--hidden]="wsStore.activeLeftTab() !== 'discussion'"
      [style.width.px]="wsStore.leftPanelWidth()"
    >
      <app-discussion-panel
        #discussionPanel
        (chatResponse)="onChatResponse($event)"
        (collapsed)="wsStore.collapseDiscussion()"
        (switchToTemplates)="wsStore.openTemplatesPanel()">
      </app-discussion-panel>
    </div>

    @if (wsStore.activeLeftTab() === 'templates') {
      <div class="left-panel-content left-panel-content--animate" [style.width.px]="wsStore.leftPanelWidth()">
        <div class="left-panel-header">
          <div class="left-panel-header__menu">
            <button class="left-panel-header__menu-btn" type="button" (click)="togglePanelSwitcher()" title="Changer de panneau">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
              </svg>
            </button>
            @if (isPanelSwitcherOpen()) {
              <div class="panel-switcher-backdrop" (click)="closePanelSwitcher()"></div>
              <div class="panel-switcher" role="menu">
                <button class="panel-switcher__item" (click)="switchToDiscussion()" type="button" role="menuitem">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                  </svg>
                  Discussion
                </button>
                <button class="panel-switcher__item panel-switcher__item--active" type="button" role="menuitem" disabled>
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                  </svg>
                  Modèles
                </button>
              </div>
            }
          </div>
          <span class="left-panel-header__title">Recherche de modèles</span>
          <div class="left-panel-header__actions">
            <app-help-popup
              title="Utiliser les modèles"
              [markdownContent]="templatesHelpContent"
            />
          </div>
        </div>
        <div class="templates-panel-scroll">
          <app-templates-panel
            [templatesSearchText]="filters.templatesSearchText()"
            (templatesSearchTextChange)="filters.templatesSearchText.set($event)"
            [isSearchingTemplates]="filters.isSearchingTemplates()"
            [filteredTemplates]="filters.filteredTemplates()"
            [isTemplatesFiltersExpanded]="wsStore.isTemplatesFiltersExpanded()"

            [selectedComponents]="filters.selectedComponents()"
            [filteredComponents]="filteredComponents"
            [componentInput]="filters.componentInput()"
            [componentDropdownOpen]="filters.componentDropdownOpen()"

            [selectedSujets]="filters.selectedSujets()"
            [filteredSujets]="filteredSujets"
            [sujetInput]="filters.sujetInput()"
            [sujetDropdownOpen]="filters.sujetDropdownOpen()"

            [selectedNiveaux]="filters.selectedNiveaux()"
            [filteredNiveaux]="filteredNiveaux"
            [niveauInput]="filters.niveauInput()"
            [niveauDropdownOpen]="filters.niveauDropdownOpen()"

            [selectedCercle]="filters.selectedCercle()"
            [CERCLE_TREE]="cercleTree"

            (searchTemplates)="filters.searchTemplates(); wsStore.collapseTemplatesFilters()"
            (toggleTemplatesFilters)="wsStore.toggleTemplatesFilters()"

            (addComponentFilter)="filters.addComponentFilter($event, wsStore.availableComponentNames())"
            (removeComponentFilter)="filters.removeComponentFilter($event)"
            (componentInputChange)="filters.onComponentInput($event, wsStore.availableComponentNames())"
            (componentInputBlur)="filters.onComponentInputBlur(wsStore.availableComponentNames())"

            (addSujet)="filters.addSujet($event)"
            (removeSujet)="filters.removeSujet($event)"
            (sujetInputChange)="filters.onSujetInput($event)"
            (sujetInputBlur)="filters.onSujetInputBlur()"

            (addNiveau)="filters.addNiveau($event)"
            (removeNiveau)="filters.removeNiveau($event)"
            (niveauInputChange)="filters.onNiveauInput($event)"
            (niveauInputBlur)="filters.onNiveauInputBlur()"

            (selectCercle)="filters.selectCercle($event)"

            (openComponentDropdown)="filters.componentDropdownOpen.set(true)"
            (closeComponentDropdown)="filters.componentDropdownOpen.set(false)"

            (openSujetDropdown)="filters.sujetDropdownOpen.set(true)"
            (closeSujetDropdown)="filters.sujetDropdownOpen.set(false)"

            (openNiveauDropdown)="filters.niveauDropdownOpen.set(true)"
            (closeNiveauDropdown)="filters.niveauDropdownOpen.set(false)"

            (useTemplate)="useTemplate($event)"
          />
        </div>
      </div>
    }

  </div>


  <div class="resize-handle"
       appResizeHandle="left"
       [class.resize-handle--hidden]="wsStore.activeLeftTab() === null">
  </div>

  <div class="content-panel">
    <app-workspace-header
      [isViewExerciseLoading]="headerViewExerciseLoading"
      [isViewPleLoading]="headerViewPleLoading"
      [templateName]="headerTemplateName"
      [activeLeftTab]="wsStore.activeLeftTab()"
      (viewExercise)="onHeaderViewExercise()"
      (viewPle)="onHeaderViewPle()"
      (resetExercise)="onHeaderResetExercise()"
      (publishExercise)="onHeaderPublishExercise()"
      (navigateToLogs)="facade.navigateToLogs()"
      (toggleLeftPanel)="toggleLeftPanel()"
    />
    <app-exercise-content-panel
      #exerciseContentPanel
      [exerciseData]="facade.exerciseData()"
      [exerciseId]="facade.exerciseId || ''"
      (updateExercise)="facade.updateExercise($event)"
      (addComponent)="facade.addComponent($event)"
      (removeComponent)="facade.removeComponent($event)"
      (addIndication)="facade.addIndication()"
      (removeIndication)="facade.removeIndication($event)"
      (addTheory)="facade.addTheory()"
      (removeTheory)="facade.removeTheory($event)"
      (previewCompleted)="onPreviewCompleted($event)">
    </app-exercise-content-panel>
  </div>


  <div class="resize-handle"
       appResizeHandle="right"
       [class.resize-handle--hidden]="wsStore.isComponentsPanelCollapsed()">
  </div>

  <app-side-panel
    [isComponentsPanelExpanded]="wsStore.isComponentsPanelExpanded"
    [isComponentsPanelCollapsed]="wsStore.isComponentsPanelCollapsed"
    [formulaireComponents]="wsStore.formulaireComponents"
    [widgetComponents]="wsStore.widgetComponents"
    (addComponent)="facade.addComponent($event)"
    (toggleTooltip)="toggleTooltip($event.name, $event.event)"
    (addComponentToDiscussion)="addComponentToDiscussion($event)"
    (collapseComponents)="wsStore.collapseComponentsPanel()"
    (expandComponents)="wsStore.expandComponentsPanel()"
  />
</div>
