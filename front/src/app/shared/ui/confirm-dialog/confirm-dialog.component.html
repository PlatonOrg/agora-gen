<div class="cdialog-backdrop" (click)="cancelled.emit()">
  <div class="cdialog" [class]="'cdialog--' + (options().variant ?? 'danger')" (click)="$event.stopPropagation()">

    <div class="cdialog__icon-wrap">
      @if ((options().variant ?? 'danger') === 'danger') {
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6"/><path d="M14 11v6"/>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </svg>
      } @else if ((options().variant ?? 'danger') === 'warning') {
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      } @else {
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      }
    </div>

    <p class="cdialog__title">{{ options().title }}</p>
    <p class="cdialog__desc">{{ options().description }}</p>

    <div class="cdialog__actions">
      <button type="button" class="cdialog__btn cdialog__btn--cancel" (click)="cancelled.emit()">
        {{ options().cancelLabel ?? 'Annuler' }}
      </button>
      <button type="button" class="cdialog__btn cdialog__btn--confirm" (click)="confirmed.emit()">
        {{ options().confirmLabel ?? 'Confirmer' }}
      </button>
    </div>

  </div>
</div>
