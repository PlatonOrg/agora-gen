<div class="panel-header">
  <span class="panel-header__title">{{ title() }}</span>
  <div class="panel-header__actions">
    <ng-content />
    <button
      class="panel-header__btn panel-header__btn--collapse"
      type="button"
      [title]="collapsed() ? 'Ouvrir le panneau' : 'Fermer le panneau'"
      (click)="onToggle()"
      [attr.aria-label]="collapsed() ? 'Ouvrir' : 'Fermer'"
    >
      @if (collapseDirection() === 'left') {
        @if (collapsed()) {
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        }
      } @else {
        @if (collapsed()) {
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        }
      }
    </button>
  </div>
</div>
